name: Deploy backend (Render)

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".gitea/workflows/deploy-backend.yml"
  workflow_dispatch:

jobs:
  deploy:
    name: Build image & deploy to Render
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      IMAGE: docker.io/${{ secrets.DOCKERHUB_USERNAME }}/olympiad-backend
    steps:
      - uses: actions/checkout@v4

      - name: Log in to Docker Hub
        run: echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login docker.io -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

      - name: Build image
        # --network=host: this runner's Docker build sandbox (the isolated bridge
        # network BuildKit uses for RUN steps) can't reach the internet, even though
        # the daemon itself can pull images fine. Building with the host's network
        # directly routes RUN steps (npm ci, prisma generate) around that bridge.
        run: docker build --network=host -t "$IMAGE:${{ github.sha }}" -t "$IMAGE:latest" backend

      - name: Push image
        run: |
          docker push "$IMAGE:${{ github.sha }}"
          docker push "$IMAGE:latest"

      - name: Trigger Render deploy
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
        run: |
          curl --fail-with-body -sS -X POST \
            "https://api.render.com/v1/services/${RENDER_SERVICE_ID}/deploys" \
            -H "Authorization: Bearer ${RENDER_API_KEY}" \
            -H "Accept: application/json" \
            -H "Content-Type: application/json" \
            -d "{\"imageUrl\": \"${IMAGE}:${{ github.sha }}\"}"

      - name: Log out of Docker Hub
        if: always()
        run: docker logout docker.io || true
