name: Deploy backend (Render)

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".gitea/workflows/deploy-backend.yml"
  workflow_dispatch:

jobs:
  deploy:
    name: Build image & deploy to Render
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      IMAGE: docker.io/${{ secrets.DOCKERHUB_USERNAME }}/olympiad-backend
    steps:
      - uses: actions/checkout@v4

      - name: Log in to Docker Hub
        run: echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login docker.io -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

      - name: Build image
        # --network=host: this runner's Docker build sandbox (the isolated bridge
        # network BuildKit uses for RUN steps) can't reach the internet, even though
        # the daemon itself can pull images fine. Building with the host's network
        # directly routes RUN steps (npm ci, prisma generate) around that bridge.
        run: docker build --network=host -t "$IMAGE:${{ github.sha }}" -t "$IMAGE:latest" backend

      - name: Push image
        run: |
          docker push "$IMAGE:${{ github.sha }}"
          docker push "$IMAGE:latest"

      - name: TEMPORARY DIAGNOSTIC - inspect Render service
        # Read-only GET, can't change anything. Checks the RENDER_SERVICE_ID/RENDER_API_KEY
        # secrets are well-formed before we try the actual deploy trigger below.

        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
        run: |
          raw_len=$(printf '%s' "$RENDER_SERVICE_ID" | wc -c)
          trimmed_len=$(printf '%s' "$RENDER_SERVICE_ID" | sed 's/^[[:space:]]*//;s/[[:space:]]*$//' | wc -c)
          echo "RENDER_SERVICE_ID raw length: $raw_len, trimmed length: $trimmed_len (a mismatch means stray whitespace/newline)"
          if [[ "$RENDER_SERVICE_ID" =~ ^srv-[A-Za-z0-9]+$ ]]; then
            echo "RENDER_SERVICE_ID format: looks correct (srv-<alphanumeric>)"
          else
            echo "RENDER_SERVICE_ID format: UNEXPECTED — does not match ^srv-[A-Za-z0-9]+\$"
          fi
          curl -sS -i "https://api.render.com/v1/services/${RENDER_SERVICE_ID}" \
            -H "Authorization: Bearer ${RENDER_API_KEY}" \
            -H "Accept: application/json"

      - name: Trigger Render deploy
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
        run: |
          curl --fail-with-body -sS -X POST \
            "https://api.render.com/v1/services/${RENDER_SERVICE_ID}/deploys" \
            -H "Authorization: Bearer ${RENDER_API_KEY}" \
            -H "Accept: application/json" \
            -H "Content-Type: application/json" \
            -d "{\"imageUrl\": \"${IMAGE}:${{ github.sha }}\"}"

      - name: Log out of Docker Hub
        if: always()
        run: docker logout docker.io || true
